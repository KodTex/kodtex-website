            - paragraph [ref=e34]: In 1954, Kailash Vivek & Co. opened its doors in the heart of Ahmedabad's fabric district — one of the world's great textile centres. What began as a trading and distribution business grew into one of Gujarat's most trusted names in fabric supply, specialising in corduroy, linen, cotton, twill, and furnishing fabrics.
            - paragraph [ref=e35]: Over seven decades, the business earned ISO 9001:2008 certification, expanded its corduroy range to the widest in India, and built lasting relationships with textile businesses across the country.
            - paragraph [ref=e36]: KodTex is the next chapter. The same heritage. The same quality. Brought directly to the makers, designers, tailors, and individuals who care about what they're working with.
